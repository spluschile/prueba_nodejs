services:
  # 1. Base de Datos Microsoft SQL Server 2022 Linux
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_cloud_test
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=CloudPass123!*
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'CloudPass123!*' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # 2. Backend Express + TypeScript API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_cloud_test
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_SERVER=sqlserver
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=CloudPass123!*
      - DB_NAME=CloudTestDb
      - DB_ENCRYPT=false
      - DB_TRUST_SERVER_CERTIFICATE=true
      - IS_DOCKER=true
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # 3. Frontend Vue 3 + TypeScript (Nginx SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_cloud_test
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlserver_data:
